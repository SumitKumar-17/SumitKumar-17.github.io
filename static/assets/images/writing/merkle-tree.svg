<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 490" font-family="Helvetica, Arial, sans-serif">
  <rect x="0.5" y="0.5" width="999" height="489" rx="10" fill="#ffffff" stroke="#e5e5e5" />

  <text x="30" y="34" font-size="11" font-weight="600" letter-spacing="0.05em" fill="#a3a3a3">EDITING ONE FILE ONLY TOUCHES ONE PATH TO THE ROOT</text>
  <line x1="30" y1="48" x2="970" y2="48" stroke="#e5e5e5" stroke-width="1" />

  <defs>
    <marker id="mk-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d4d4d4" />
    </marker>
  </defs>

  <!-- edges: neutral, drawn first so nodes sit on top -->
  <g stroke="#d4d4d4" stroke-width="1.4">
    <!-- leaves to level1 -->
    <line x1="90" y1="400" x2="145" y2="330" />
    <line x1="200" y1="400" x2="145" y2="330" />
    <line x1="310" y1="400" x2="365" y2="330" />
    <line x1="420" y1="400" x2="365" y2="330" />
    <line x1="530" y1="400" x2="585" y2="330" />
    <line x1="640" y1="400" x2="585" y2="330" />
    <line x1="750" y1="400" x2="805" y2="330" />
    <line x1="860" y1="400" x2="805" y2="330" />
    <!-- level1 to level2 -->
    <line x1="145" y1="300" x2="255" y2="230" />
    <line x1="365" y1="300" x2="255" y2="230" />
    <line x1="585" y1="300" x2="475" y2="230" />
    <line x1="805" y1="300" x2="475" y2="230" />
    <!-- level2 to root -->
    <line x1="255" y1="200" x2="475" y2="120" />
    <line x1="475" y1="200" x2="475" y2="120" />
  </g>

  <!-- highlighted path: leaf2 -> node1 -> nodeA -> root (recomputed, orange) -->
  <g stroke="#e0743c" stroke-width="2.4">
    <line x1="310" y1="400" x2="365" y2="330" />
    <line x1="365" y1="300" x2="255" y2="230" />
    <line x1="255" y1="200" x2="475" y2="120" />
  </g>

  <!-- proof siblings needed to verify (sent, not recomputed, blue dashed) -->
  <g stroke="#2f6fed" stroke-width="2" stroke-dasharray="5,3">
    <line x1="420" y1="400" x2="365" y2="330" />
    <line x1="145" y1="300" x2="255" y2="230" />
    <line x1="475" y1="200" x2="475" y2="120" />
  </g>

  <!-- leaves -->
  <g font-size="11.5">
    <!-- leaf 0,1 untouched pair -->
    <rect x="62" y="400" width="56" height="34" rx="6" fill="#fafafa" stroke="#d4d4d4" stroke-width="1.3" />
    <text x="90" y="421" text-anchor="middle" fill="#737373">a.go</text>
    <rect x="172" y="400" width="56" height="34" rx="6" fill="#fafafa" stroke="#d4d4d4" stroke-width="1.3" />
    <text x="200" y="421" text-anchor="middle" fill="#737373">b.go</text>

    <!-- leaf 2: the edited file -->
    <rect x="282" y="400" width="56" height="34" rx="6" fill="#fdf1ea" stroke="#e0743c" stroke-width="2" />
    <text x="310" y="421" text-anchor="middle" fill="#b5541f" font-weight="700">c.go*</text>

    <!-- leaf 3: proof sibling -->
    <rect x="392" y="400" width="56" height="34" rx="6" fill="#eef4ff" stroke="#2f6fed" stroke-width="2" stroke-dasharray="4,2" />
    <text x="420" y="421" text-anchor="middle" fill="#2f6fed">d.go</text>

    <rect x="502" y="400" width="56" height="34" rx="6" fill="#fafafa" stroke="#d4d4d4" stroke-width="1.3" />
    <text x="530" y="421" text-anchor="middle" fill="#737373">e.go</text>
    <rect x="612" y="400" width="56" height="34" rx="6" fill="#fafafa" stroke="#d4d4d4" stroke-width="1.3" />
    <text x="640" y="421" text-anchor="middle" fill="#737373">f.go</text>
    <rect x="722" y="400" width="56" height="34" rx="6" fill="#fafafa" stroke="#d4d4d4" stroke-width="1.3" />
    <text x="750" y="421" text-anchor="middle" fill="#737373">g.go</text>
    <rect x="832" y="400" width="56" height="34" rx="6" fill="#fafafa" stroke="#d4d4d4" stroke-width="1.3" />
    <text x="860" y="421" text-anchor="middle" fill="#737373">h.go</text>
  </g>
  <text x="500" y="452" text-anchor="middle" font-size="11" fill="#a3a3a3">leaves: hash(file contents)</text>

  <!-- level 1 -->
  <rect x="117" y="300" width="56" height="30" rx="15" fill="#fafafa" stroke="#d4d4d4" stroke-width="1.3" />
  <rect x="337" y="300" width="56" height="30" rx="15" fill="#fdf1ea" stroke="#e0743c" stroke-width="2" />
  <rect x="557" y="300" width="56" height="30" rx="15" fill="#fafafa" stroke="#d4d4d4" stroke-width="1.3" />
  <rect x="777" y="300" width="56" height="30" rx="15" fill="#fafafa" stroke="#d4d4d4" stroke-width="1.3" />

  <!-- level 2 -->
  <rect x="227" y="200" width="56" height="30" rx="15" fill="#fdf1ea" stroke="#e0743c" stroke-width="2" />
  <rect x="447" y="200" width="56" height="30" rx="15" fill="#eef4ff" stroke="#2f6fed" stroke-width="2" stroke-dasharray="4,2" />

  <!-- root -->
  <rect x="432" y="100" width="86" height="40" rx="20" fill="#fdf1ea" stroke="#e0743c" stroke-width="2.4" />
  <text x="475" y="125" text-anchor="middle" font-size="12.5" font-weight="700" fill="#b5541f">root</text>

  <line x1="30" y1="460" x2="970" y2="460" stroke="#e5e5e5" stroke-width="1" />
  <g font-size="11.5">
    <rect x="30" y="470" width="14" height="10" fill="#fdf1ea" stroke="#e0743c" stroke-width="2" />
    <text x="50" y="479" fill="#737373">recomputed - edited leaf and its chain to the root</text>
    <rect x="460" y="470" width="14" height="10" fill="#eef4ff" stroke="#2f6fed" stroke-width="2" stroke-dasharray="3,2" />
    <text x="480" y="479" fill="#737373">sent as the proof - sibling hashes, not recomputed</text>
  </g>
</svg>
