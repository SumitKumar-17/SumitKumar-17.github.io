<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 480" font-family="Helvetica, Arial, sans-serif">
  <rect x="0.5" y="0.5" width="1099" height="479" rx="10" fill="#ffffff" stroke="#e5e5e5" />

  <text x="30" y="36" font-size="11" font-weight="600" letter-spacing="0.05em" fill="#a3a3a3">CONTAINERS SHARE A KERNEL - SANDBOXES CAN'T AFFORD TO</text>
  <line x1="30" y1="50" x2="1070" y2="50" stroke="#e5e5e5" stroke-width="1" />

  <!-- LEFT: a container -->
  <text x="285" y="82" text-anchor="middle" font-size="15" font-weight="700" fill="#e0743c">A container</text>

  <rect x="60" y="100" width="100" height="56" rx="8" fill="#fbeee6" stroke="#e0743c" stroke-width="1.5" />
  <text x="110" y="132" text-anchor="middle" font-size="12" fill="#1f2430">App A</text>

  <rect x="175" y="100" width="100" height="56" rx="8" fill="#fbeee6" stroke="#e0743c" stroke-width="1.5" />
  <text x="225" y="132" text-anchor="middle" font-size="12" fill="#1f2430">App B</text>

  <rect x="290" y="100" width="100" height="56" rx="8" fill="#fbeee6" stroke="#e0743c" stroke-width="1.5" />
  <text x="340" y="132" text-anchor="middle" font-size="12" fill="#1f2430">App C</text>

  <line x1="110" y1="156" x2="200" y2="210" stroke="#e0743c" stroke-width="1.3" />
  <line x1="225" y1="156" x2="225" y2="210" stroke="#e0743c" stroke-width="1.3" />
  <line x1="340" y1="156" x2="250" y2="210" stroke="#e0743c" stroke-width="1.3" />

  <rect x="60" y="212" width="330" height="70" rx="8" fill="#fdf6f2" stroke="#e0743c" stroke-width="1.8" />
  <text x="225" y="242" text-anchor="middle" font-size="13" font-weight="700" fill="#e0743c">Host kernel (shared)</text>
  <text x="225" y="262" text-anchor="middle" font-size="11" fill="#9a6a52">namespaces + cgroups as the only boundary</text>

  <text x="225" y="315" text-anchor="middle" font-size="12" fill="#1f2430" font-weight="600">Escape surface: the shared syscall table</text>
  <text x="225" y="334" text-anchor="middle" font-size="11" fill="#a3a3a3">a compromised container can still be a compromised kernel</text>

  <!-- divider -->
  <line x1="420" y1="70" x2="420" y2="400" stroke="#e5e5e5" stroke-width="1" />

  <!-- RIGHT: sandkiln -->
  <text x="755" y="82" text-anchor="middle" font-size="15" font-weight="700" fill="#1f8a70">A sandkiln sandbox</text>

  <rect x="450" y="100" width="610" height="182" rx="10" fill="#f2faf7" stroke="#1f8a70" stroke-width="1.5" stroke-dasharray="4,3" />
  <text x="755" y="120" text-anchor="middle" font-size="11" fill="#1f8a70">host, under KVM</text>

  <g>
    <rect x="470" y="135" width="170" height="130" rx="8" fill="#ffffff" stroke="#1f8a70" stroke-width="1.8" />
    <text x="555" y="158" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1f2430">Sandbox A</text>
    <text x="555" y="182" text-anchor="middle" font-size="11" fill="#737373">own kernel</text>
    <text x="555" y="200" text-anchor="middle" font-size="11" fill="#737373">own filesystem</text>
    <text x="555" y="218" text-anchor="middle" font-size="11" fill="#737373">own network ns</text>
  </g>

  <g>
    <rect x="665" y="135" width="170" height="130" rx="8" fill="#ffffff" stroke="#1f8a70" stroke-width="1.8" />
    <text x="750" y="158" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1f2430">Sandbox B</text>
    <text x="750" y="182" text-anchor="middle" font-size="11" fill="#737373">own kernel</text>
    <text x="750" y="200" text-anchor="middle" font-size="11" fill="#737373">own filesystem</text>
    <text x="750" y="218" text-anchor="middle" font-size="11" fill="#737373">own network ns</text>
  </g>

  <g>
    <rect x="860" y="135" width="170" height="130" rx="8" fill="#ffffff" stroke="#1f8a70" stroke-width="1.8" />
    <text x="945" y="158" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1f2430">Sandbox C</text>
    <text x="945" y="182" text-anchor="middle" font-size="11" fill="#737373">own kernel</text>
    <text x="945" y="200" text-anchor="middle" font-size="11" fill="#737373">own filesystem</text>
    <text x="945" y="218" text-anchor="middle" font-size="11" fill="#737373">own network ns</text>
  </g>

  <text x="755" y="315" text-anchor="middle" font-size="12" fill="#1f2430" font-weight="600">Isolation boundary: hardware virtualization (KVM)</text>
  <text x="755" y="334" text-anchor="middle" font-size="11" fill="#a3a3a3">each sandbox is isolated at the hardware level, not just the namespace level</text>

  <line x1="30" y1="360" x2="1070" y2="360" stroke="#e5e5e5" stroke-width="1" />

  <text x="225" y="390" text-anchor="middle" font-size="12" fill="#9a6a52">Cold start: ~100ms - 1s+</text>
  <text x="755" y="390" text-anchor="middle" font-size="12" fill="#1f8a70" font-weight="700">Cold start: 10.5-10.9ms, measured</text>

  <text x="550" y="430" text-anchor="middle" font-size="11" fill="#a3a3a3">figures from sandkiln's own criterion benchmarks against real Firecracker, single dev box - directional, not authoritative</text>
</svg>
