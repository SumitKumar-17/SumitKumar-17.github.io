<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" font-family="Helvetica, Arial, sans-serif">
  <rect x="0.5" y="0.5" width="959" height="459" rx="10" fill="#ffffff" stroke="#e5e5e5" />

  <text x="30" y="36" font-size="11" font-weight="600" letter-spacing="0.05em" fill="#a3a3a3">A MOUNT IS A MUTABLE VIEW OVER AN IMMUTABLE HISTORY</text>
  <line x1="30" y1="50" x2="930" y2="50" stroke="#e5e5e5" stroke-width="1" />

  <defs>
    <marker id="tf-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#737373" />
    </marker>
  </defs>

  <!-- Mounted working tree -->
  <rect x="30" y="90" width="230" height="300" rx="10" fill="#fafafa" stroke="#d4d4d4" stroke-width="1.5" />
  <text x="145" y="118" text-anchor="middle" font-size="13.5" font-weight="700" fill="#171717">Mounted working tree</text>
  <text x="145" y="136" text-anchor="middle" font-size="11" fill="#a3a3a3">mutable, in memory</text>

  <rect x="55" y="160" width="180" height="42" rx="6" fill="#ffffff" stroke="#e5e5e5" />
  <text x="145" y="186" text-anchor="middle" font-size="12.5" fill="#171717">your files</text>

  <rect x="55" y="215" width="180" height="42" rx="6" fill="#ffffff" stroke="#e5e5e5" />
  <text x="145" y="241" text-anchor="middle" font-size="12.5" fill="#171717">dirty pages (WorkTree)</text>

  <text x="145" y="300" text-anchor="middle" font-size="11" fill="#a3a3a3">only dirty paths are</text>
  <text x="145" y="316" text-anchor="middle" font-size="11" fill="#a3a3a3">written on checkpoint</text>

  <!-- arrows between the two halves -->
  <line x1="260" y1="160" x2="330" y2="160" stroke="#737373" stroke-width="1.6" marker-end="url(#tf-arrow)" />
  <text x="295" y="148" text-anchor="middle" font-size="10.5" fill="#737373">snap / fsync</text>

  <line x1="330" y1="330" x2="260" y2="330" stroke="#737373" stroke-width="1.6" marker-end="url(#tf-arrow)" />
  <text x="295" y="318" text-anchor="middle" font-size="10.5" fill="#737373">restore / branch</text>

  <!-- Repository -->
  <rect x="330" y="90" width="600" height="300" rx="10" fill="#fafafa" stroke="#d4d4d4" stroke-width="1.5" />
  <text x="630" y="118" text-anchor="middle" font-size="13.5" font-weight="700" fill="#171717">Repository</text>
  <text x="630" y="136" text-anchor="middle" font-size="11" fill="#a3a3a3">immutable objects, named by BLAKE3 hash, plus tiny mutable refs</text>

  <!-- commit chain -->
  <circle cx="420" cy="220" r="26" fill="#ffffff" stroke="#2f6fed" stroke-width="2" />
  <text x="420" y="225" text-anchor="middle" font-size="12" font-weight="700" fill="#2f6fed">C1</text>

  <line x1="446" y1="220" x2="534" y2="220" stroke="#737373" stroke-width="1.6" marker-end="url(#tf-arrow)" />

  <circle cx="560" cy="220" r="26" fill="#ffffff" stroke="#2f6fed" stroke-width="2" />
  <text x="560" y="225" text-anchor="middle" font-size="12" font-weight="700" fill="#2f6fed">C2</text>

  <line x1="586" y1="220" x2="674" y2="220" stroke="#737373" stroke-width="1.6" marker-end="url(#tf-arrow)" />

  <circle cx="700" cy="220" r="26" fill="#ffffff" stroke="#2f6fed" stroke-width="2" />
  <text x="700" y="225" text-anchor="middle" font-size="12" font-weight="700" fill="#2f6fed">C3</text>

  <text x="760" y="200" font-size="11" font-weight="600" fill="#171717">main</text>
  <line x1="700" y1="194" x2="755" y2="202" stroke="#171717" stroke-width="1.3" marker-end="url(#tf-arrow)" />

  <!-- branch off C2 -->
  <line x1="560" y1="246" x2="560" y2="300" stroke="#737373" stroke-width="1.6" marker-end="url(#tf-arrow)" />
  <circle cx="560" cy="330" r="26" fill="#ffffff" stroke="#e0743c" stroke-width="2" stroke-dasharray="3,2" />
  <text x="560" y="335" text-anchor="middle" font-size="11" font-weight="700" fill="#e0743c">Bx</text>
  <text x="614" y="326" font-size="11" font-weight="600" fill="#e0743c">experiment</text>
  <line x1="560" y1="304" x2="605" y2="328" stroke="#e0743c" stroke-width="1.3" marker-end="url(#tf-arrow)" />

  <text x="630" y="370" text-anchor="middle" font-size="11" fill="#a3a3a3">unchanged subtrees are shared, not copied - a snapshot is a hash, not a copy</text>

  <line x1="30" y1="415" x2="930" y2="415" stroke="#e5e5e5" stroke-width="1" />
  <text x="30" y="440" font-size="11" fill="#737373">objects are written before any ref points at them, so a crash leaves only harmless garbage</text>
</svg>
